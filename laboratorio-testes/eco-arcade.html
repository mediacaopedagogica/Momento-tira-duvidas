<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Eco Arcade</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#12102d;color:#fff}.wrap{max-width:1000px;margin:auto;padding:24px}.arcade{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}.machine{background:linear-gradient(#6d42bc,#3b246e);border:4px solid #f2d1ff;border-radius:24px;padding:18px;text-align:center;box-shadow:0 0 24px #b86cff66;cursor:pointer}.screen{height:130px;border-radius:14px;background:#0d2230;display:grid;place-items:center;font-size:48px;margin-bottom:12px}.panel{margin-top:18px;background:#fff;color:#34295f;padding:18px;border-radius:18px}.back{color:#fff}@media(max-width:750px){.arcade{grid-template-columns:1fr 1fr}}</style></head><body><main class="wrap"><a class="back" href="index.html">← Laboratório</a><h1>🕹️ Eco Arcade</h1><p>Escolha uma máquina para abrir um mini desafio.</p><div class="arcade"><div class="machine" data-t="♻️ Separação" data-m="Qual destino é mais adequado para um material reciclável limpo? Pense em coleta seletiva e cadeia de reciclagem."><div class="screen">♻️</div><b>Separação</b></div><div class="machine" data-t="💡 Energia" data-m="Identifique uma decisão de projeto que pode reduzir consumo de energia no uso do ambiente."><div class="screen">💡</div><b>Energia</b></div><div class="machine" data-t="💧 Água" data-m="Escolha uma solução que reduza desperdício de água sem comprometer o uso do espaço."><div class="screen">💧</div><b>Água</b></div><div class="machine" data-t="🧱 Materiais" data-m="Compare duas opções de material considerando origem, durabilidade e fim de vida."><div class="screen">🧱</div><b>Materiais</b></div></div><div class="panel" id="panel">Insira uma ficha imaginária e escolha uma máquina. ✨</div></main><script>document.querySelectorAll('.machine').forEach(m=>m.onclick=()=>panel.innerHTML=`<h2>${m.dataset.t}</h2><p>${m.dataset.m}</p><b>+100 EcoPontos de teste ⭐</b>`);</script></body></html>
