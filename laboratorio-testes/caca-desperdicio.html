<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Caça ao Desperdício</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#10152f;color:#fff}.wrap{max-width:900px;margin:auto;padding:24px}.hud{display:flex;justify-content:space-between}.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;background:#1f2f5d;padding:12px;border-radius:22px}.cell{aspect-ratio:1;border-radius:12px;background:#2d477d;display:grid;place-items:center;font-size:34px;cursor:pointer}.cell:hover{background:#3a5a98}.msg{margin-top:15px;background:#fff;color:#332b61;border-radius:16px;padding:16px}.back{color:#fff}</style></head><body><main class="wrap"><a class="back" href="index.html">← Laboratório</a><div class="hud"><div><h1>👾 Caça ao Desperdício</h1><p>Clique nas boas práticas e evite os desperdícios.</p></div><div><b id="score">0</b> pts</div></div><div class="grid" id="grid"></div><div class="msg" id="msg">Encontre os itens sustentáveis escondidos.</div></main><script>const good=['♻️','🌱','💡','🚲','💧','🔁'],bad=['🗑️','🚿','💡','🛍️','🚗','📦'];let pts=0;for(let i=0;i<30;i++){let c=document.createElement('div');c.className='cell';let isGood=Math.random()>.45;c.textContent=isGood?good[Math.floor(Math.random()*good.length)]:bad[Math.floor(Math.random()*bad.length)];c.dataset.good=isGood;c.onclick=()=>{if(c.dataset.done)return;c.dataset.done=1;if(c.dataset.good==='true'){pts+=10;c.style.background='#4f9b68';msg.textContent='Boa! Você identificou uma prática mais sustentável.'}else{pts=Math.max(0,pts-5);c.style.background='#9a4d69';msg.textContent='Ops! Esse item representa desperdício ou consumo pouco eficiente.'}score.textContent=pts};grid.appendChild(c)}</script></body></html>
