<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mapa dos Mundos</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(#8ed3ff,#c7e89b);color:#32285d}.wrap{max-width:1000px;margin:auto;padding:24px}.map{position:relative;min-height:520px;border-radius:28px;background:linear-gradient(#a7ddff 0 42%,#83c36c 42%);overflow:hidden;border:5px solid #fff}.path{position:absolute;left:8%;right:8%;top:50%;height:18px;background:#f5d78f;border-radius:999px;transform:rotate(-5deg)}.world{position:absolute;width:150px;height:150px;border-radius:50%;border:6px solid #fff;display:grid;place-items:center;text-align:center;font-weight:900;cursor:pointer;box-shadow:0 12px 24px #0003}.w1{left:7%;top:50%;background:#b8e6a0}.w2{left:28%;top:28%;background:#9bd8ff}.w3{left:49%;top:49%;background:#ffe28a}.w4{left:70%;top:25%;background:#d4b0ef}.locked{filter:grayscale(1);opacity:.55;cursor:not-allowed}.panel{margin-top:16px;background:#fff;border-radius:18px;padding:18px;min-height:100px}.back{color:#4c3a79}</style></head><body><main class="wrap"><a class="back" href="index.html">← Laboratório</a><h1>🗺️ Mapa dos Mundos</h1><p>Conclua um mundo para desbloquear o próximo.</p><section class="map"><div class="path"></div><button class="world w1" data-i="0">🌿<br>Mundo dos Materiais</button><button class="world w2 locked" data-i="1">💧<br>Mundo da Água</button><button class="world w3 locked" data-i="2">💡<br>Mundo da Energia</button><button class="world w4 locked" data-i="3">♻️<br>Mundo Circular</button></section><div class="panel" id="panel">Comece pelo Mundo dos Materiais.</div></main><script>const msgs=['Compare materiais considerando origem, durabilidade e fim de vida.','Identifique decisões que reduzem consumo e desperdício de água.','Observe iluminação, equipamentos e estratégias de eficiência energética.','Pense o projeto como parte de um ciclo: reduzir, reutilizar, recuperar e reciclar.'];let unlocked=0;document.querySelectorAll('.world').forEach(b=>b.onclick=()=>{let i=+b.dataset.i;if(i>unlocked)return;panel.innerHTML=`<h2>${b.textContent.trim()}</h2><p>${msgs[i]}</p><button id="done">Concluir mundo ⭐</button>`;done.onclick=()=>{if(unlocked<3){unlocked=Math.max(unlocked,i+1);document.querySelectorAll('.world')[unlocked].classList.remove('locked')}panel.innerHTML+='<p><b>✅ Mundo concluído!</b></p>'}});</script></body></html>
