<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Caixa Misteriosa</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#2b1d59,#6f4aa6);color:#fff}.wrap{max-width:960px;margin:auto;padding:24px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.box{aspect-ratio:1;border:0;border-radius:20px;background:linear-gradient(#ffd867,#ff9f59);font-size:48px;font-weight:1000;color:#6f3e38;cursor:pointer;box-shadow:inset 0 8px #fff5,0 12px 22px #0004}.box.open{background:#fff;color:#4b3478;font-size:18px;padding:12px}.panel{margin-top:18px;background:#fff;color:#3b2b67;padding:18px;border-radius:18px;min-height:100px}.back{color:#fff}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}}</style></head><body><main class="wrap"><a class="back" href="index.html">← Laboratório</a><h1>🎁 Caixa Misteriosa</h1><p>Abra os blocos para descobrir conteúdos diferentes.</p><div class="grid" id="grid"></div><div class="panel" id="panel">Escolha uma caixa.</div></main><script>const data=[['📄','Artigo','Leia um artigo selecionado e identifique uma aplicação prática no projeto.'],['💡','Dica','Antes de especificar um material, observe uso, manutenção e durabilidade.'],['🎯','Desafio','Como você explicaria sua escolha de projeto para um cliente que discorda dela?'],['🧱','Material','Compare duas opções de acabamento considerando desempenho e contexto.'],['📐','Prática','Liste o que precisa ser conferido antes de iniciar um levantamento.'],['✨','Tendência','Analise uma tendência e separe estética de necessidade real do usuário.'],['🧠','Reflexão','Qual decisão do designer mais influencia a experiência do usuário neste ambiente?'],['🗂️','Checklist','Briefing, medidas, referências, orçamento, materiais e apresentação.']];grid.innerHTML=data.map((d,i)=>`<button class="box" data-i="${i}">?</button>`).join('');document.querySelectorAll('.box').forEach(b=>b.onclick=()=>{let d=data[b.dataset.i];b.classList.add('open');b.innerHTML=`${d[0]}<br><b>${d[1]}</b>`;panel.innerHTML=`<h2>${d[0]} ${d[1]}</h2><p>${d[2]}</p>`});</script></body></html>
