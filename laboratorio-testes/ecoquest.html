<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EcoQuest</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#201b48;color:#fff}.wrap{max-width:1000px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center}.game{position:relative;height:520px;border-radius:24px;overflow:hidden;background:linear-gradient(#8bd7ff 0 55%,#9fe084 55% 72%,#6c9d4d 72%);border:4px solid #fff}.cloud{position:absolute;font-size:55px;opacity:.9}.c1{left:90px;top:55px}.c2{right:110px;top:90px}.ground{position:absolute;bottom:0;width:100%;height:130px;background:repeating-linear-gradient(90deg,#5d3f2c 0 30px,#79543d 30px 60px)}.player{position:absolute;bottom:125px;left:60px;font-size:54px;transition:left .15s,bottom .15s;z-index:3}.item{position:absolute;font-size:38px;cursor:pointer;z-index:2}.i1{left:230px;bottom:190px}.i2{left:470px;bottom:250px}.i3{left:720px;bottom:180px}.block{position:absolute;width:80px;height:28px;background:#fff4;border:2px solid #fff;border-radius:10px}.b1{left:205px;bottom:165px}.b2{left:445px;bottom:225px}.b3{left:695px;bottom:155px}.panel{margin-top:16px;background:#fff;color:#3c2f6e;padding:16px;border-radius:18px}.btn{border:0;border-radius:12px;padding:10px 14px;background:#8e70dd;color:#fff;font-weight:800;cursor:pointer}.back{color:#fff}</style></head><body><main class="wrap"><div class="top"><div><a class="back" href="index.html">← Laboratório</a><h1>🌱 EcoQuest</h1><p>Use ← → para mover e espaço para pular. Colete os 3 EcoPontos.</p></div><div><b id="score">0/3</b> ⭐</div></div><section class="game" id="game"><div class="cloud c1">☁️</div><div class="cloud c2">☁️</div><div class="ground"></div><div class="block b1"></div><div class="block b2"></div><div class="block b3"></div><div class="item i1" data-msg="Reutilizar materiais prolonga sua vida útil e reduz descarte.">♻️</div><div class="item i2" data-msg="Eficiência energética deve ser considerada desde a concepção do projeto.">💡</div><div class="item i3" data-msg="Escolher materiais de menor impacto faz parte do ecodesign.">🌿</div><div class="player" id="p">🧑‍🎨</div></section><div class="panel" id="panel">Colete um item para revelar uma orientação sustentável.</div></main><script>let x=60,jump=false,n=0;const p=document.getElementById('p'),items=[...document.querySelectorAll('.item')],panel=document.getElementById('panel');function move(d){x=Math.max(20,Math.min(900,x+d));p.style.left=x+'px';check()}function check(){items.forEach(i=>{if(i.style.display==='none')return;let ix=parseInt(getComputedStyle(i).left);if(Math.abs(ix-x)<55){i.style.display='none';n++;score.textContent=n+'/3';panel.textContent=i.dataset.msg;if(n===3)panel.innerHTML='<b>🎉 Fase concluída!</b> Você coletou todos os EcoPontos.'}})}addEventListener('keydown',e=>{if(e.key==='ArrowLeft')move(-35);if(e.key==='ArrowRight')move(35);if(e.code==='Space'&&!jump){jump=true;p.style.bottom='220px';setTimeout(()=>{p.style.bottom='125px';jump=false;check()},380)}});</script></body></html>
