<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reformando Fases</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#efe8f8;color:#382a66}.wrap{max-width:960px;margin:auto;padding:24px}.room{min-height:430px;border-radius:24px;background:linear-gradient(#e9f2ff 0 68%,#d8c0a5 68%);padding:28px;position:relative;overflow:hidden}.scene{font-size:72px;text-align:center;margin-top:70px}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}.choice{border:0;border-radius:16px;padding:16px;background:#fff;color:#3a2c69;font-weight:900;cursor:pointer;box-shadow:0 8px 18px #725f8c22}.status{margin-top:15px;background:#fff;border-radius:16px;padding:16px}.back{color:#69479a}</style></head><body><main class="wrap"><a class="back" href="index.html">← Laboratório</a><h1>🛠️ Reformando Fases</h1><p>Escolha uma decisão para cada ambiente.</p><section class="room"><div id="title"><h2>Fase 1 — Sala de estar</h2></div><div class="scene" id="scene">🛋️🪴💡</div><div class="choices" id="choices"></div></section><div class="status" id="status">Analise a situação e escolha uma solução.</div></main><script>const fases=[{t:'Sala de estar',s:'🛋️🪴💡',q:['Priorizar circulação e uso real do ambiente','Escolher apenas pela tendência do momento','Ignorar a iluminação existente'],ok:0},{t:'Cozinha compacta',s:'🍳🧊🗄️',q:['Aumentar objetos sem função','Planejar armazenamento e fluxo de trabalho','Bloquear acessos para ganhar bancada'],ok:1},{t:'Escritório',s:'🖥️🪑📚',q:['Considerar ergonomia e organização','Usar qualquer cadeira disponível','Posicionar a tela sem observar iluminação'],ok:0}];let i=0;function render(){let f=fases[i];title.innerHTML=`<h2>Fase ${i+1} — ${f.t}</h2>`;scene.textContent=f.s;choices.innerHTML=f.q.map((x,n)=>`<button class="choice" data-n="${n}">${x}</button>`).join('');document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{if(+b.dataset.n===f.ok){status.innerHTML='<b>✅ Boa decisão!</b> Você considerou um critério profissional pertinente.';setTimeout(()=>{i=(i+1)%fases.length;render()},900)}else status.innerHTML='<b>🔎 Reavalie.</b> Pense no uso, na segurança, no conforto e nas necessidades do ambiente.'})}render();</script></body></html>
