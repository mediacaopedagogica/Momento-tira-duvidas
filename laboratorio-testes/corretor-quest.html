<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Corretor Quest</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(#201744,#4b367c);color:#fff}.wrap{max-width:1000px;margin:auto;padding:24px}.city{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;background:#cde8ff;padding:20px;border-radius:24px}.node{min-height:130px;border-radius:20px;background:#fff;color:#3c2d6c;padding:14px;text-align:center;position:relative;box-shadow:0 8px 18px #0002}.node.active{outline:5px solid #ffcf65;transform:scale(1.02)}.icon{font-size:45px}.mission{margin-top:16px;background:#fff;color:#3c2d6c;padding:18px;border-radius:18px;min-height:110px}.btn{border:0;padding:12px 18px;border-radius:12px;background:#ff8ab6;color:#fff;font-weight:900;cursor:pointer}.back{color:#fff}</style></head><body><main class="wrap"><a class="back" href="index.html">← Laboratório</a><h1>🏙️ Corretor Quest</h1><p>Avance pela cidade e descubra as etapas de uma operação imobiliária.</p><section class="city" id="city"></section><div class="mission" id="mission">Clique em “Avançar” para iniciar a rota.</div><p><button class="btn" id="next">🎲 Avançar</button></p></main><script>const data=[['🏢','Imobiliária','Capte o imóvel e registre as informações essenciais.'],['🚪','Visita','Prepare a visita e confirme as necessidades do cliente.'],['📄','Documentação','Confira matrícula, identificação das partes e documentos necessários.'],['💬','Proposta','Registre valores, condições e prazos com clareza.'],['🏦','Banco','Analise a etapa de financiamento quando aplicável.'],['✍️','Contrato','Revise obrigações, condições e assinaturas.'],['🏛️','Registro','Entenda quando o registro é necessário para a transferência.'],['🔑','Chaves','Conclua a jornada com entrega e orientações finais.']];let pos=-1;city.innerHTML=data.map((d,i)=>`<div class="node" id="n${i}"><div class="icon">${d[0]}</div><b>${d[1]}</b></div>`).join('');next.onclick=()=>{document.querySelectorAll('.node').forEach(n=>n.classList.remove('active'));pos=(pos+1)%data.length;document.getElementById('n'+pos).classList.add('active');mission.innerHTML=`<h3>${data[pos][0]} ${data[pos][1]}</h3><p>${data[pos][2]}</p>${pos===data.length-1?'<b>🎉 Operação concluída!</b>':''}`};</script></body></html>
