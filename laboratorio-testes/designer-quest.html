<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Designer Quest</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5eefe;color:#382b70}.wrap{max-width:1000px;margin:auto;padding:24px}.path{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}.stage{background:#fff;border:2px solid #e5d9f5;border-radius:18px;padding:18px;text-align:center;min-height:150px;opacity:.5}.stage.active{opacity:1;outline:4px solid #c89ce7}.ico{font-size:42px}.card{margin-top:18px;background:#fff;border-radius:20px;padding:20px;box-shadow:0 10px 24px #76549c22}.btn{border:0;border-radius:12px;padding:11px 16px;background:#8d6bd6;color:#fff;font-weight:900;cursor:pointer}.back{color:#5c3b98}</style></head><body><main class="wrap"><a class="back" href="index.html">← Laboratório</a><h1>🎨 Designer Quest</h1><p>Avance pelas etapas de um projeto profissional.</p><div class="path" id="path"></div><div class="card" id="card">Comece pelo briefing.</div><p><button class="btn" id="next">Avançar etapa →</button></p></main><script>const s=[['🗣️','Briefing','Entenda necessidades, rotina, orçamento e expectativas do cliente.'],['📏','Levantamento','Registre medidas, condicionantes e características do ambiente.'],['💡','Conceito','Defina partido, referências e diretrizes do projeto.'],['🧱','Materiais','Selecione acabamentos, mobiliário e soluções compatíveis.'],['💰','Orçamento','Organize os itens que fazem parte da atuação do design de interiores.'],['🖼️','Apresentação','Comunique o projeto de forma clara e visual.']];let i=0;path.innerHTML=s.map((x,n)=>`<div class="stage ${n===0?'active':''}" id="s${n}"><div class="ico">${x[0]}</div><b>${x[1]}</b></div>`).join('');function show(){document.querySelectorAll('.stage').forEach((e,n)=>e.classList.toggle('active',n===i));card.innerHTML=`<h2>${s[i][0]} ${s[i][1]}</h2><p>${s[i][2]}</p>`}show();next.onclick=()=>{i=(i+1)%s.length;show()};</script></body></html>
