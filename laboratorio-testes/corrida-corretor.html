<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Corrida do Corretor</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#19213b;color:#fff}.wrap{max-width:1000px;margin:auto;padding:24px}.track{position:relative;height:420px;border-radius:24px;overflow:hidden;background:linear-gradient(#8fd0ff 0 45%,#87bd67 45% 58%,#555 58% 100%);border:4px solid #fff}.road{position:absolute;left:0;right:0;bottom:0;height:176px;background:repeating-linear-gradient(90deg,#555 0 80px,#666 80px 160px)}.line{position:absolute;bottom:84px;width:100%;border-top:6px dashed #fff}.car{position:absolute;left:40px;bottom:38px;font-size:58px;transition:left .18s}.stop{position:absolute;bottom:155px;font-size:40px}.s1{left:220px}.s2{left:450px}.s3{left:680px}.panel{margin-top:15px;background:#fff;color:#342a61;border-radius:16px;padding:16px}.back{color:#fff}</style></head><body><main class="wrap"><a class="back" href="index.html">← Laboratório</a><h1>🚗 Corrida do Corretor</h1><p>Use → para avançar. Pare nos checkpoints e descubra a missão.</p><div class="track"><div class="road"></div><div class="line"></div><div class="stop s1">🏠</div><div class="stop s2">🏦</div><div class="stop s3">🏛️</div><div class="car" id="car">🚙</div></div><div class="panel" id="panel">Saia da imobiliária e percorra a rota.</div></main><script>let x=40,last=-1;const checks=[[220,'🏠 Visita','Confirme necessidades do cliente e registre observações do imóvel.'],[450,'🏦 Financiamento','Explique que a análise financeira depende das condições e documentos aplicáveis.'],[680,'🏛️ Registro','Identifique a etapa documental necessária para formalizar a transferência quando cabível.']];function go(d){x=Math.max(20,Math.min(860,x+d));car.style.left=x+'px';checks.forEach((c,i)=>{if(Math.abs(x-c[0])<35&&last!==i){last=i;panel.innerHTML=`<h3>${c[1]}</h3><p>${c[2]}</p>`}})}addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(35);if(e.key==='ArrowLeft')go(-35)});</script></body></html>
