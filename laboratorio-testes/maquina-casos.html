<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Máquina de Casos</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:radial-gradient(circle at top,#5b2d7f,#171126);color:#fff}.wrap{max-width:900px;margin:auto;padding:24px}.slot{background:#e5c7ff;border:8px solid #8d59b5;border-radius:28px;padding:24px;box-shadow:0 20px 40px #0006}.reels{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.reel{background:#fff;color:#39265c;border-radius:18px;padding:20px;text-align:center;min-height:160px;display:grid;place-items:center;font-size:22px;font-weight:900}.btn{display:block;margin:20px auto 0;border:0;border-radius:16px;padding:14px 24px;background:#ff8fbf;color:#fff;font-size:18px;font-weight:900;cursor:pointer}.case{margin-top:18px;background:#fff;color:#37275c;border-radius:18px;padding:18px}.back{color:#fff}</style></head><body><main class="wrap"><a class="back" href="index.html">← Laboratório</a><h1>🎰 Máquina de Casos Imobiliários</h1><p>Gere um caso combinando cliente, imóvel e situação.</p><section class="slot"><div class="reels"><div class="reel" id="r1">👤 Cliente</div><div class="reel" id="r2">🏠 Imóvel</div><div class="reel" id="r3">⚠️ Situação</div></div><button class="btn" id="spin">GERAR CASO</button></section><div class="case" id="case">Clique para criar uma situação prática.</div></main><script>const a=['Família com criança pequena','Investidor iniciante','Pessoa idosa','Casal buscando primeiro imóvel','Locatário em mudança'],b=['Apartamento usado','Terreno urbano','Sala comercial','Casa em condomínio','Imóvel para locação'],c=['Documentação incompleta','Proposta abaixo do valor','Financiamento em análise','Dúvida sobre contrato','Necessidade de visita urgente'];spin.onclick=()=>{let x=a[Math.floor(Math.random()*a.length)],y=b[Math.floor(Math.random()*b.length)],z=c[Math.floor(Math.random()*c.length)];r1.textContent='👤 '+x;r2.textContent='🏠 '+y;r3.textContent='⚠️ '+z;case.innerHTML=`<b>Missão:</b> você atende <b>${x}</b>, interessado em <b>${y}</b>, mas surgiu <b>${z.toLowerCase()}</b>. Qual seria o próximo passo profissional?`};</script></body></html>
