<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Elevador Imobiliário</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#26243a;color:#fff}.wrap{max-width:900px;margin:auto;padding:24px}.elevator{display:grid;grid-template-columns:1fr 150px;gap:20px;background:#555365;border-radius:28px;padding:20px}.doors{height:430px;background:linear-gradient(90deg,#8f8d98 49%,#444 50%,#999 51%);border:8px solid #bbb;border-radius:16px;display:grid;place-items:center;transition:.5s}.doors.open{background:#fff;color:#3d2c67}.panel{display:grid;gap:10px;align-content:start}.floor{border:0;border-radius:50%;width:58px;height:58px;margin:auto;background:#1b1a27;color:#fff;font-weight:900;cursor:pointer}.floor.active{background:#ffcf67;color:#4b335f}.msg{max-width:520px;padding:22px;text-align:center;font-size:20px}.back{color:#fff}</style></head><body><main class="wrap"><a class="back" href="index.html">← Laboratório</a><h1>🛗 Elevador Imobiliário</h1><p>Escolha um andar e abra uma etapa da jornada.</p><div class="elevator"><div class="doors" id="doors"><div class="msg" id="msg">PORTAS FECHADAS<br><small>Escolha um andar.</small></div></div><div class="panel" id="panel"></div></div></main><script>const f=[['T','🏢 Captação','Conheça o imóvel, o proprietário e as informações necessárias para iniciar o atendimento.'],['1','🚪 Visita','Prepare a experiência de visita e registre dúvidas do interessado.'],['2','📄 Documentos','Verifique os documentos relevantes antes de avançar.'],['3','💬 Negociação','Organize proposta, condições e contraproposta.'],['4','✍️ Contrato','Revise responsabilidades, condições e assinaturas.'],['5','🔑 Fechamento','Finalize a operação e registre os próximos passos.']];panel.innerHTML=f.map((x,i)=>`<button class="floor" data-i="${i}">${x[0]}</button>`).join('');document.querySelectorAll('.floor').forEach(b=>b.onclick=()=>{document.querySelectorAll('.floor').forEach(x=>x.classList.remove('active'));b.classList.add('active');let x=f[b.dataset.i];doors.classList.remove('open');msg.innerHTML='Subindo...';setTimeout(()=>{doors.classList.add('open');msg.innerHTML=`<h2>${x[1]}</h2><p>${x[2]}</p>`},450)});</script></body></html>
